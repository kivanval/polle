app {
  database {
    host = ${?DB_HOST}
    port = 5432
    port = ${?DB_PORT}
    name = ${?DB_NAME}
    user = ${?DB_USER}
    password = ${?DB_PASSWORD}
    sslmode = "require"
    sslmode = ${?DB_SSLMODE}

    pool-size = 5
    pool-size = ${?DB_POOL_SIZE}
    max-overflow = 5
    max-overflow = ${?DB_MAX_OVERFLOW}
    pool-pre-ping = true
    pool-pre-ping = ${?DB_POOL_PRE_PING}
    pool-recycle-seconds = 300
    pool-recycle-seconds = ${?DB_POOL_RECYCLE_SECONDS}
  }

  caching {
    ttl = "4h"
    ttl = ${?CACHING_TTL}
    redis-url = ${REDIS_URL}
    enabled = true
  }

  logging {
    level = "INFO"
    level = ${?LOG_LEVEL}
    format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  }

  solver {
    num-workers = 4
    num-workers = ${?SOLVER_NUM_WORKERS}

    time-limit-seconds = 180.0
    time-limit-seconds = ${?SOLVER_TIME_LIMIT_SECONDS}

    random-seed = 42
    random-seed = ${?SOLVER_RANDOM_SEED}

    log-search-progress = true
    log-search-progress = ${?SOLVER_LOG_SEARCH_PROGRESS}

    relative-gap-limit = 0.1
    relative-gap-limit = ${?SOLVER_RELATIVE_GAP_LIMIT}
  }

  broker {
    redis-url = ${REDIS_URL}
    channel-name = "solver_channel"
    channel-name = ${?BROKER_CHANNEL_NAME}
    health-check-interval-seconds = 30
    health-check-interval-seconds = ${?REDIS_HEALTH_CHECK_INTERVAL}
    socket-keepalive = true
    socket-keepalive = ${?REDIS_SOCKET_KEEPALIVE}
  }

  services {
    fields {
      base-url = ${FIELDS_SERVICE_URL}

      timeout-seconds = 60
      timeout-seconds = ${?FIELDS_SERVICE_TIMEOUT}

      token = ${FIELDS_SERVICE_TOKEN}

      auth-header-name = "X-Fields-Api-Key"
      auth-header-name = ${?FIELDS_SERVICE_AUTH_HEADER_NAME}

      auth-prefix = ${?FIELDS_SERVICE_AUTH_PREFIX}
    }
    climate {
      base-url = ${CLIMATE_SERVICE_URL}

      timeout-seconds = 60
      timeout-seconds = ${?CLIMATE_SERVICE_TIMEOUT}

      token = ${CLIMATE_SERVICE_TOKEN}

      auth-header-name = "X-Climate-Api-Key"
      auth-header-name = ${?CLIMATE_SERVICE_AUTH_HEADER_NAME}

      auth-prefix = ${?CLIMATE_SERVICE_AUTH_PREFIX}
    }
    finance {
      base-url = ${FINANCE_SERVICE_URL}

      timeout-seconds = 90
      timeout-seconds = ${?FINANCE_SERVICE_TIMEOUT}

      token = ${FINANCE_SERVICE_TOKEN}

      auth-header-name = "X-Finance-Api-Key"
      auth-header-name = ${?FINANCE_SERVICE_AUTH_HEADER_NAME}

      auth-prefix = ${?FINANCE_SERVICE_AUTH_PREFIX}
    }
  }
}