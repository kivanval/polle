openapi: 3.0.3
info:
  title: Arable Planning Solver API
  version: 2.4.0
  description: API for optimizing crop rotation and schedule for a single arable field using asynchronous tasks.

paths:
  /api/v1/solver/optimizations:
    post:
      summary: Enqueue optimization for a single field
      operationId: submit_optimization_task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizeFieldRequest'
      responses:
        '202':
          description: Optimization task successfully enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'

  /api/v1/solver/optimizations/{task_id}/status:
    get:
      summary: Check optimization task status
      operationId: get_optimization_status
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task is still processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatusResponse'

  /api/v1/solver/optimizations/{task_id}/result:
    get:
      summary: Get optimization task result
      operationId: get_optimization_result
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful crop plan result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizeFieldResponse'

  /api/v1/solver/evaluations:
    post:
      summary: Evaluate a specific crop rotation scenario
      operationId: submit_scenario_evaluation_task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateScenarioRequest'
      responses:
        '202':
          description: Evaluation task successfully enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'

  /api/v1/solver/evaluations/{task_id}/status:
    get:
      summary: Check evaluation task status
      operationId: get_evaluation_status
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task is still processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatusResponse'

  /api/v1/solver/evaluations/{task_id}/result:
    get:
      summary: Get scenario evaluation result
      operationId: get_evaluation_result
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful scenario evaluation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateScenarioResponse'

components:
  schemas:
    SolverResultStatus:
      type: string
      enum: [OPTIMAL, FEASIBLE, INFEASIBLE, UNKNOWN]

    TaskProcessingState:
      type: string
      enum: [processing]

    TaskErrorState:
      type: string
      enum: [error]

    PlanningHorizon:
      type: object
      required:
        - start_year_month
        - end_year_month
      properties:
        start_year_month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        end_year_month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'

    RiskSettings:
      type: object
      properties:
        allow_missing_data:
          type: boolean
          default: true
        allow_agronomic_risks:
          type: boolean
          default: true
        allow_soil_depletion:
          type: boolean
          default: true

    ResolutionStrategy:
      type: string
      enum: [BINARY, TERNARY, QUATERNARY, CONTINUOUS]

    IrrigationSettings:
      type: object
      required:
        - apply
        - resolution
      properties:
        apply:
          type: boolean
        material_id:
          type: string
          nullable: true
        resolution:
          $ref: '#/components/schemas/ResolutionStrategy'

    FertilizerSettings:
      type: object
      required:
        - apply
        - resolution
      properties:
        apply:
          type: boolean
        resolution:
          $ref: '#/components/schemas/ResolutionStrategy'

    ReplenishmentStrategy:
      type: object
      required:
        - irrigation
        - fertilizers
      properties:
        irrigation:
          $ref: '#/components/schemas/IrrigationSettings'
        fertilizers:
          $ref: '#/components/schemas/FertilizerSettings'

    SolverStrategySettings:
      type: object
      properties:
        risk:
          $ref: '#/components/schemas/RiskSettings'
        replenishment:
          $ref: '#/components/schemas/ReplenishmentStrategy'

    OptimizeFieldRequest:
      type: object
      required:
        - field_id
        - horizon
      properties:
        field_id:
          type: string
        horizon:
          $ref: '#/components/schemas/PlanningHorizon'
        strategy:
          $ref: '#/components/schemas/SolverStrategySettings'

    TaskResponse:
      type: object
      required:
        - task_id
      properties:
        task_id:
          type: string

    TaskStatusResponse:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/TaskProcessingState'

    TaskErrorResponse:
      type: object
      required:
        - status
        - error
      properties:
        status:
          $ref: '#/components/schemas/TaskErrorState'
        error:
          type: string

    CropNote:
      type: object
      required:
        - importance
        - category
        - message
      properties:
        importance:
          type: string
          enum: ["info", "warn", "risk"]
        category:
          type: string
          enum: ["data_missing", "agronomic", "soil_health"]
        message:
          type: string

    CropProfileCycleMonthlyDynamics:
      type: object
      description: Granular monthly water and nutrient dynamics for reporting and charting.
      required:
        - water_applied_mm
        - water_removed_mm
        - nitrogen_applied_kg_ha
        - nitrogen_fixed_kg_ha
        - nitrogen_removed_kg_ha
        - phosphorus_applied_kg_ha
        - phosphorus_removed_kg_ha
        - potassium_applied_kg_ha
        - potassium_removed_kg_ha
      properties:
        water_applied_mm:
          type: object
          additionalProperties:
            type: number
          description: Irrigation water supplied per month (mm).
        water_removed_mm:
          type: object
          additionalProperties:
            type: number
          description: Actual crop water consumption and evapotranspiration (ETc) per month (mm).
        nitrogen_applied_kg_ha:
          type: object
          additionalProperties:
            type: number
          description: Nitrogen fertilizer applied per month (kg/ha).
        nitrogen_fixed_kg_ha:
          type: object
          additionalProperties:
            type: number
          description: Nitrogen biologically fixed by legumes per month (kg/ha).
        nitrogen_removed_kg_ha:
          type: object
          additionalProperties:
            type: number
          description: Nitrogen removed from soil via harvest per month (kg/ha).
        phosphorus_applied_kg_ha:
          type: object
          additionalProperties:
            type: number
          description: Phosphorus fertilizer applied per month (kg/ha).
        phosphorus_removed_kg_ha:
          type: object
          additionalProperties:
            type: number
          description: Phosphorus removed from soil via harvest per month (kg/ha).
        potassium_applied_kg_ha:
          type: object
          additionalProperties:
            type: number
          description: Potassium fertilizer applied per month (kg/ha).
        potassium_removed_kg_ha:
          type: object
          additionalProperties:
            type: number
          description: Potassium removed from soil via harvest per month (kg/ha).

    FertilizerApplication:
      type: object
      required:
        - material_id
        - rate_kg_ha
      properties:
        material_id:
          type: string
          description: ID of the applied fertilizer material.
        rate_kg_ha:
          type: number
          minimum: 0
          description: Physical application rate in kg per hectare.

    IrrigationApplication:
      type: object
      required:
        - material_id
        - amount_mm
      properties:
        material_id:
          type: string
          description: ID of the applied irrigation water material.
        amount_mm:
          type: number
          description: Total irrigation water allowance for the crop cycle in millimeters (mm).

    CropProfileCycleFinancials:
      type: object
      description: Detailed breakdown of projected revenues and costs.
      required:
        - gross_revenue_cents
        - base_opex_cents
        - planting_cost_cents
        - water_cost_cents
        - fertilizer_cost_cents
      properties:
        gross_revenue_cents:
          type: integer
          description: Total expected revenue from crop yield.
        base_opex_cents:
          type: integer
          description: Base operational expenses per hectare multiplied by area.
        planting_cost_cents:
          type: integer
          description: Cost of seeds/planting material.
        water_cost_cents:
          type: integer
          description: Cost of applied irrigation water.
        fertilizer_cost_cents:
          type: integer
          description: Cost of applied fertilizers.

    CropProfileCycle:
      type: object
      required:
        - crop_profile_id
        - plant_date
        - clearance_date
        - harvest_dates
        - financials
        - yield_multiplier
        - monthly_dynamics
        - notes
      properties:
        crop_profile_id:
          type: string
        plant_date:
          type: string
          format: date
        clearance_date:
          type: string
          format: date
        harvest_dates:
          type: array
          items:
            type: string
            format: date
        financials:
          $ref: '#/components/schemas/CropProfileCycleFinancials'
        yield_multiplier:
          type: number
        fertilizer_application:
          $ref: '#/components/schemas/FertilizerApplication'
        monthly_dynamics:
          $ref: '#/components/schemas/CropProfileCycleMonthlyDynamics'
        notes:
          type: array
          items:
            $ref: "#/components/schemas/CropNote"

    OptimizeFieldResponse:
      type: object
      required:
        - status
        - schedule
      properties:
        status:
          $ref: '#/components/schemas/SolverResultStatus'
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/CropProfileCycle'

    EvaluateScenarioResponse:
      type: object
      required:
        - status
        - schedule
      properties:
        status:
          $ref: '#/components/schemas/SolverResultStatus'
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/CropProfileCycle'

    ScenarioPlannedCrop:
      type: object
      required:
        - crop_profile_id
        - plant_date
      properties:
        crop_profile_id:
          type: string
        plant_date:
          type: string
          format: date
        clearance_date:
          type: string
          format: date
        fertilizer_application:
          $ref: '#/components/schemas/FertilizerApplication'
        irrigation_application:
          $ref: '#/components/schemas/IrrigationApplication'

    EvaluateScenarioRequest:
      type: object
      required:
        - field_id
        - horizon
        - schedule
      properties:
        field_id:
          type: string
        horizon:
          $ref: '#/components/schemas/PlanningHorizon'
        risk:
          $ref: '#/components/schemas/RiskSettings'
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioPlannedCrop'