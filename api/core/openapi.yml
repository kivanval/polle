components:
  schemas:
    AssistantChatRequest:
      required:
      - message
      - history
      - pageContext
      - conversationContext
      type: object
      properties:
        message:
          type:
          - 'null'
          - string
        history:
          type:
          - 'null'
          - array
          items:
            $ref: '#/components/schemas/AssistantHistoryItem'
        pageContext:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AssistantPageContext'
        conversationContext:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AssistantConversationContext'
    AssistantChatResponse:
      required:
      - message
      - conversationContext
      - scenarioJson
      type: object
      properties:
        message:
          type: string
        conversationContext:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AssistantConversationContext'
        scenarioJson:
          type:
          - 'null'
          - string
        strategyRunId:
          type:
          - 'null'
          - string
          format: uuid
        fieldId:
          type:
          - 'null'
          - string
          format: uuid
    AssistantConversationContext:
      required:
      - lastTool
      - farmId
      - startMonth
      - planningHorizonYears
      type: object
      properties:
        lastTool:
          type: string
        farmId:
          type: string
          format: uuid
        startMonth:
          type:
          - 'null'
          - string
        planningHorizonYears:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          format: int32
        fieldId:
          type:
          - 'null'
          - string
          format: uuid
        runId:
          type:
          - 'null'
          - string
          format: uuid
    AssistantHistoryItem:
      required:
      - role
      - content
      type: object
      properties:
        role:
          type: string
        content:
          type: string
    AssistantPageContext:
      required:
      - pageType
      - farmId
      - fieldId
      type: object
      properties:
        pageType:
          type:
          - 'null'
          - string
        farmId:
          type:
          - 'null'
          - string
          format: uuid
        fieldId:
          type:
          - 'null'
          - string
          format: uuid
    BudgetAllocationItem:
      required:
      - category
      - amountUsd
      - updatedAtUtc
      type: object
      properties:
        category:
          type: string
        amountUsd:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
          - number
          - string
          format: double
        updatedAtUtc:
          type: string
          format: date-time
    BudgetAllocationRequest:
      required:
      - amountUsd
      type: object
      properties:
        amountUsd:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
          - 'null'
          - number
          - string
          description: USD, 0 or more with at most 2 decimals; null or 0 removes the category.
          format: double
    BudgetAllocationsResponse:
      required:
      - farmId
      - budgetUsd
      - categories
      - allocations
      - allocatedUsd
      - unallocatedUsd
      type: object
      properties:
        farmId:
          type: string
          format: uuid
        budgetUsd:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
          - 'null'
          - number
          - string
          format: double
        categories:
          type: array
          items:
            type: string
          description: 'Category keys in display order: seeds, fertilizers, crop_protection, fuel, machinery, labor, irrigation,
            other.'
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/BudgetAllocationItem'
        allocatedUsd:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
          - number
          - string
          format: double
        unallocatedUsd:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
          - 'null'
          - number
          - string
          description: BudgetUsd − AllocatedUsd; negative when over-allocated, null without a budget.
          format: double
    BudgetRequest:
      required:
      - budgetUsd
      type: object
      properties:
        budgetUsd:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
          - 'null'
          - number
          - string
          description: USD, 0 or more with at most 2 decimals; null clears the budget.
          format: double
    CatalogChangeResponse:
      required:
      - id
      - table
      - action
      - key
      - before
      - after
      - cascade
      - editor
      - byYou
      - changedAtUtc
      type: object
      properties:
        id:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int64
        table:
          type: string
        action:
          type: string
        key:
          $ref: '#/components/schemas/JsonElement'
        before:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/JsonElement'
        after:
