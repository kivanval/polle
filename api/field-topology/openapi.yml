openapi: 3.1.0
info:
  title: Field Topology API
  version: 1.0.0
  description: Service providing arable land topology and soil properties.

paths:
  /api/v1/fields/{field_id}/{year_month}:
    get:
      summary: Retrieve field details and soil state by ID and month
      operationId: getFieldByIdAndMonth
      parameters:
        - name: field_id
          in: path
          required: true
          description: Unique identifier of the field
          schema:
            type: string
        - name: year_month
          in: path
          required: true
          description: "Reference YearMonth (e.g. 2024-10) to get current field conditions."
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
      responses:
        '200':
          description: Field topology record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldTopology'
        '400':
          description: Bad Request - Invalid year_month
        '401':
          description: Unauthorized - Missing or wrong API key
        '404':
          description: Field not found
        '429':
          description: Too Many Requests - per-route limit reached; retry after the Retry-After header

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Fields-Api-Key
  schemas:
    FieldTopology:
      type: object
      required:
        - id
        - name
        - area_ha
        - initial_depletion_mm
        - soil
      properties:
        id:
          type: string
          description: Unique identifier of the field
          example: "field_01"
        name:
          type: string
          description: Human-readable field label
          example: "North Valley"
        area_ha:
          type: number
          format: float
          description: Net arable area in hectares
          example: 120.5
        initial_depletion_mm:
          type: number
          format: float
          description: Starting root-zone moisture depletion in mm (0 = field capacity).
          example: 45.2
        soil:
          $ref: '#/components/schemas/SoilProperties'
          description: Mandatory soil characteristics, hydraulics, and nutrient pools.

    SoilProperties:
      type: object
      required:
        - texture
        - drainage
        - ph
        - salinity_ds_m
        - hydraulics
        - nutrients
      properties:
        texture:
          type: string
          description: Soil texture classification
          enum:
            - sand
            - loamy_sand
            - sandy_loam
            - loam
            - silt_loam
            - clay_loam
            - clay
            - peat
        drainage:
          type: string
          description: Soil drainage classification
          enum:
            - well_drained
            - moderate
            - poor
        ph:
          type: number
          format: float
          description: Soil acidity level
          example: 6.5
        salinity_ds_m:
          type: number
          format: float
          description: Soil electrical conductivity (salinity) in dS/m
          example: 0.8
        hydraulics:
          $ref: '#/components/schemas/SoilHydraulics'
        nutrients:
          $ref: '#/components/schemas/SoilNutrients'

    SoilNutrients:
      type: object
      description: Soil macro-nutrient reserves and dynamic balance limits (kg/ha)
      required:
        - nitrogen
        - phosphorus
        - potassium
      properties:
        nitrogen:
          $ref: '#/components/schemas/NutrientPool'
        phosphorus:
          $ref: '#/components/schemas/NutrientPool'
        potassium:
          $ref: '#/components/schemas/NutrientPool'

    NutrientPool:
      type: object
      required:
        - initial_kg_ha
        - min_kg_ha
        - max_kg_ha
      properties:
        initial_kg_ha:
          type: number
          format: float
          description: Starting available nutrient reserve in root zone (kg/ha)
          example: 120.0
        min_kg_ha:
          type: number
          format: float
          description: Absolute minimum soil pool lower bound (kg/ha)
          example: 20.0
        max_kg_ha:
          type: number
          format: float
          description: Absolute maximum soil pool saturation ceiling (kg/ha)
          example: 350.0

    SoilHydraulics:
      type: object
      required:
        - max_soil_depth_m
        - field_capacity_vol
        - wilting_point_vol
        - total_available_water_mm
      properties:
        max_soil_depth_m:
          type: number
          format: float
          description: Maximum penetrable soil depth in meters
          example: 1.2
        field_capacity_vol:
          type: number
          format: float
          description: Volumetric water content at field capacity (FC) in m3/m3
          example: 0.27
        wilting_point_vol:
          type: number
          format: float
          description: Volumetric water content at permanent wilting point (PWP) in m3/m3
          example: 0.12