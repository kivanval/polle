# Builds and tests core and web on every pull request and on main.
name: CI

on:
  pull_request:
    paths: [core/**, web/**, .github/workflows/ci.yml]
  push:
    branches: [main]
    paths: [core/**, web/**, .github/workflows/ci.yml]

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Polle.sln
      - run: dotnet build Polle.sln --no-restore -c Release
      - run: dotnet test Polle.sln --no-build -c Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
