      - resource_capacities
      type: object
      properties:
        farm_context:
          $ref: '#/components/schemas/SolverFarmContext'
        resource_capacities:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SolverResourceCapacities'
    SolverResourceCapacities:
      required:
      - monthly_limits
      type: object
      properties:
        monthly_limits:
          $ref: '#/components/schemas/SolverMonthlyLimits'
    StrategyChoice:
      type: object
      properties:
        preset:
          type:
          - 'null'
          - string
          description: Key of a preset from GET /api/strategy-presets; leave the other fields out.
        allowMissingData:
          type:
          - 'null'
          - boolean
        allowAgronomicRisks:
          type:
          - 'null'
          - boolean
        allowSoilDepletion:
          type:
          - 'null'
          - boolean
        irrigation:
          type:
          - 'null'
          - string
        fertilizer:
          type:
          - 'null'
          - string
        name:
          type:
          - 'null'
          - string
          description: 'Custom strategies only: the farmer''s name for it, up to 80 characters; blank uses one made from the
            settings.'
        description:
          type:
          - 'null'
          - string
          description: 'Custom strategies only: a description, up to 400 characters; blank uses one made from the settings.'
    StrategyCycle:
      required:
      - cropProfileId
      - cropId
      - cropName
      - systemName
      - plantingMonth
      - clearanceMonth
      - harvestMonths
      - revenueUsd
      - costsUsd
      - yieldPercent
      - irrigationMm
      - notes
      - nutrients
      - risks
      - warnings
      - monthlyWater
      - noteDetails
      type: object
      properties:
        cropProfileId:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int64
        cropId:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int64
        cropName:
          type: string
        systemName:
          type: string
        plantingMonth:
          type: string
        clearanceMonth:
          type: string
        harvestMonths:
          type: array
          items:
            type: string
        revenueUsd:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
          - number
          - string
          format: double
        costsUsd:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
          - number
          - string
          format: double
        yieldPercent:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
          - number
          - string
          format: double
        irrigationMm:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
          - number
          - string
          format: double
        notes:
          type: array
          items:
            type: string
        nutrients:
          $ref: '#/components/schemas/CycleNutrients'
        risks:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        monthlyWater:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyWater'
        noteDetails:
          type: array
          items:
            $ref: '#/components/schemas/CycleNote'
        fertilizer:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CycleFertilizer'
        operatingCostsUsd:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
          - 'null'
          - number
          - string
          format: double
        costBreakdown:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CostBreakdown'
        estimated:
          type: boolean
          default: false
        plantingDate:
          type:
          - 'null'
          - string
        clearanceDate:
          type:
          - 'null'
          - string
        harvestDates:
          type:
          - 'null'
          - array
          items:
            type: string
    StrategyJobResponse:
      required:
      - key
      - name
      - summary
      - state
      - result
      - error
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        summary:
          type: string
        state:
          type: string
          description: processing, ready or failed
        result:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/StrategyResult'
        error:
          type:
          - 'null'
          - string
        settings:
          oneOf:
          - type: 'null'
          - description: What the solver was allowed to do for this strategy; null for the current plan, which is scored with
              each crop's own water and fertilizer.
            $ref: '#/components/schemas/StrategySettings'
        estimated:
          type: boolean
          description: 'The current plan only: true when the solver left it unscored and the result is this API''s audit from
            the crop catalog, the field''s climate and its soil settings.'
          default: false
    StrategyPresetResponse:
      required:
      - key
      - name
      - summary
      - settings
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        summary:
          type: string
        settings:
          $ref: '#/components/schemas/StrategySettings'
    StrategyResult:
      required:
      - status
      - profitUsd
      - revenueUsd
      - costsUsd
      - irrigationMm
      - nitrogenBalanceKgHa
      - cycles
      - risks
      - dataGaps
      - warnings
      - waterUseMm
      type: object
      properties:
        status:
          type: string
        profitUsd:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
          - 'null'
          - number
          - string
          format: double
        revenueUsd:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
          - number
          - string
          format: double
        costsUsd:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
          - number
          - string
          format: double
        irrigationMm:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
          - number
          - string
          format: double
        nitrogenBalanceKgHa:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
          - number
          - string
          format: double
        cycles:
          type: array
          items:
            $ref: '#/components/schemas/StrategyCycle'
        risks:
          type: array
          items:
            type: string
        dataGaps:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        waterUseMm:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
          - 'null'
          - number
          - string
          format: double
        operatingCostsUsd:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
          - 'null'
          - number
          - string
          format: double
        costBreakdown:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CostBreakdown'
    StrategyRunRequest:
      required:
      - startMonth
      - endMonth
      type: object
      properties:
        startMonth:
          type:
          - 'null'
          - string
          description: First month of the horizon, YYYY-MM; at most five years before this month, so past seasons can be evaluated
            too.
        endMonth:
          type:
          - 'null'
          - string
          description: Last month of the horizon, YYYY-MM; less than thirty years after the start.
        strategies:
          type:
          - 'null'
          - array
          items:
            $ref: '#/components/schemas/StrategyChoice'
          description: 'The strategies to run: presets by key and custom settings. Omitted or empty runs the six presets.'
        planOnly:
          type: boolean
          description: True scores only the field's current plan, with no strategies; the plan needs crops sown inside the
            horizon. False runs only the strategies, without scoring the plan.
          default: false
    StrategyRunResponse:
      required:
      - id
      - fieldId
      - startMonth
      - endMonth
      - createdAtUtc
      - jobs
      type: object
      properties:
        id:
          type: string
          format: uuid
        fieldId:
          type: string
          format: uuid
        startMonth:
          type: string
        endMonth:
          type: string
        createdAtUtc:
          type: string
          format: date-time
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/StrategyJobResponse'
    StrategySettings:
      required:
      - irrigation
      - fertilizer
      - allowAgronomicRisks
      - allowSoilDepletion
      - allowMissingData
      type: object
      properties:
        irrigation:
          type: boolean
        fertilizer:
          type: boolean
        allowAgronomicRisks:
          type: boolean
        allowSoilDepletion:
          type: boolean
        allowMissingData:
          type: boolean
        irrigationLevel:
          type: string
          default: 'OFF'
        fertilizerLevel:
          type: string
          default: 'OFF'
    TrendCell:
      required:
      - month
      - status
      - percentile
      - droughtClass
      - tmeanC
      - tminC
      - tmaxC
      - precipitation30dMm
      - et030dMm
      - waterBalance30dMm
      type: object
      properties:
        month:
          type: string
        status:
          type: string
        percentile:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
          - 'null'
          - number
          - string
          format: double
        droughtClass:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
        tmeanC:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
          - 'null'
          - number
          - string
          format: double
        tminC:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
          - 'null'
          - number
          - string
          format: double
        tmaxC:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
          - 'null'
          - number
          - string
          format: double
        precipitation30dMm:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
          - 'null'
          - number
          - string
          format: double
        et030dMm:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
          - 'null'
          - number
          - string
          format: double
        waterBalance30dMm:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
          - 'null'
          - number
          - string
          format: double
    WorkerRequest:
      required:
      - fullName
      - payType
      - payRateUsd
      type: object
      properties:
        fullName:
          maxLength: 150
          type: string
        payType:
          type: string
          description: hourly (rate is USD per worked hour) or monthly (rate is a USD salary per month).
        payRateUsd:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
          - number
          - string
          description: USD, 0 or more with at most 2 decimals.
          format: double
        position:
          maxLength: 100
          type:
          - 'null'
          - string
          description: Free-text job title, e.g. tractor driver.
        laborCategoryId:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          description: Optional labour type id from GET /api/labor-categories.
          format: int32
        phone:
          maxLength: 40
          type:
          - 'null'
          - string
        hiredOn:
          type:
          - 'null'
          - string
          format: date
        isActive:
          type:
          - 'null'
          - boolean
          description: Inactive workers keep their history but are left out of planned payroll. Defaults to true.
        notes:
          maxLength: 2000
          type:
          - 'null'
          - string
    WorkerResponse:
      required:
      - id
      - farmId
      - fullName
      - position
      - laborCategoryId
      - phone
      - payType
      - payRateUsd
      - hiredOn
      - isActive
      - notes
      - shifts
      - createdAtUtc
      - updatedAtUtc
      type: object
      properties:
        id:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
        farmId:
          type: string
          format: uuid
        fullName:
          type: string
        position:
          type:
          - 'null'
          - string
        laborCategoryId:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          format: int32
        phone:
          type:
          - 'null'
          - string
        payType:
          type: string
        payRateUsd:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
          - number
          - string
          format: double
        hiredOn:
          type:
          - 'null'
          - string
          format: date
        isActive:
          type: boolean
        notes:
          type:
          - 'null'
          - string
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/WorkerShiftResponse'
          description: The worker's own recurring shifts, by month and weekday.
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
    WorkerScheduleRequest:
      required:
      - months
      - shifts
      type: object
      properties:
        months:
          type: array
          items:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
            - integer
            - string
            format: int32
          description: 'Months to replace, January = 1: one to twelve distinct values.'
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/OperatorShiftTemplate'
          description: Every shift of the week, up to 168. An empty list clears the chosen months.
    WorkerShiftResponse:
      required:
      - id
      - month
      - dayOfWeek
      - startTime
      - endTime
      type: object
      properties:
        id:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
        month:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
        dayOfWeek:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
