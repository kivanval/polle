[build-system]
requires = ["setuptools>=64.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "felder"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ortools==9.15.6755",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pyhocon==0.3.60",
    "python-dotenv>=1.0",
    "fastapi==0.115.5",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "dishka>=1.2.0",
    "taskiq==0.13.0",
    "taskiq-fastapi==0.3.3",
    "taskiq-redis==1.2.4",
    "redis==8.0.0",
    "numpy>=1.26.0",
    "numba>=0.59.0",
    "httpx==0.27.0",
    "click==8.1.7",
    "cashews==7.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "datamodel-code-generator==0.92.0",
    "openapi-python-client==0.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v"
testpaths = [
    "tests",
]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src", "."]
packages = ["app", "tests"]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

exclude = [
    "^src/app/autogen/",
    "^src/app/clients/",
]

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = true
disallow_untyped_defs = false
warn_return_any = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
force-exclude = true
extend-exclude = [
    "src/app/autogen",
    "src/app/clients",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "T20",
    "RUF",
    "SIM",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["T201", "S101", "PLR2004", "SLF001"]
"src/app/autogen/**/*" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true